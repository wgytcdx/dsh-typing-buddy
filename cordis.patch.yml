# dsh-typing-buddy —— 挂载 + 默认配置
#
# 安装：dsh plugin --profile <profile> add link:/绝对路径   （或 link: 到本目录）
# 改配置：直接改下面 config 里的值，宿主会热重载（不用重启）
- insert:
    - id: typing-buddy
      name: dsh-typing-buddy
      config:
        # 头像：图片 URL，或本机绝对路径（/Users/xxx/avatar.png）；留空用包内内置图
        avatar: ""
        # 头像直径（px）
        size: 40
        # 状态文字胶囊内边距（px），控制文字边框大小
        pillPadding: 8
        desktopEnabled: true
        # 位置：top-right | top-center | top-left | bottom-right | bottom-left
        position: top-right
        # 离边距离（px）
        offsetX: 22
        offsetY: 74
        # 各状态文案；{n} 会被替换成正在运行的会话数
        textIdle: "小鲸鱼"
        textRunning: "正在回复"
        textMulti: "正在回复·{n}"
        # 工作时是否显示键盘小图标
        showKeyboardIcon: true
        # 是否允许拖动（拖过的位置记在浏览器本地）
        draggable: true
        # 右下角窄屏（<640px）时自动改小
        compactOnNarrow: true
