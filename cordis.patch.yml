# dsh-typing-buddy — Muse 式动态头像
# DSH「插件 → 添加插件 → 本地目录」选择本仓库；修改后重新加载组件。
- insert:
    - id: typing-buddy
      name: dsh-typing-buddy
      config:
        name: "小鲸鱼"
        # 传统单图兼容：图片 URL / 本机绝对路径；空使用内置肖像。
        avatar: ""
        # 本机资产包清单；相对媒体路径以清单所在目录解析。
        assetPack: ""
        size: 110
        pillPadding: 6
        position: top-right
        offsetX: 22
        offsetY: 74
        idleLabel: ""
        # 普通动画与文案的最短展示时长；断线/恢复立即切换。
        minStateDuration: 1500
        theme: auto
        respectReducedMotion: true
        draggable: true
        compactOnNarrow: true
        desktopEnabled: true
        # 可选的现有桌面伴侣 beacon；不安装桌面伴侣时可关闭。
        beacon: true
        # 生成默认关闭。启用后密钥只从宿主进程的 AGNES_API_KEY 等环境变量读取。
        # 候选生成、换装和视频生成均由形象面板中明确的操作触发。
        generationEnabled: false
